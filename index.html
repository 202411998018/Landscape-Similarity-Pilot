<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片判断任务</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
  <section id="welcome" class="panel">
    <h1>图片判断任务</h1>
    <p class="lead">每次会呈现三张图片，请选择其中与你认为另外两张最不相似的一张。请根据直观感受作答，没有标准答案。</p>
    <div class="instructions">
      <p>实验包含练习和三个正式区块，每个区块100题。请使用电脑，在安静的环境中完成。每个区块结束后可以休息。</p>
      <p>本实验记录匿名编号、图片选择和反应时间，不收集姓名或学号。参与完全自愿，你可以随时退出。已保存在本机的数据可自行导出或清除。</p>
    </div>
    <label class="check"><input id="consent" type="checkbox"> 我已阅读说明，并同意参与。</label>
    <label class="field">参与编号<input id="participant" maxlength="32" autocomplete="off"></label>
    <div id="resume-info" class="muted"></div>
    <div class="actions">
      <button id="start" class="primary">开始</button>
      <button id="resume" hidden>继续</button>
      <button id="reset">清除本机记录</button>
    </div>
  </section>

  <section id="experiment" class="panel" hidden>
    <div class="progressrow"><span id="stage-label"></span><span id="progress-text"></span></div>
    <div class="bar"><div id="bar-inner"></div></div>
    <div id="fixation" class="fixation" hidden>＋</div>
    <div id="prompt">请选择与另外两张最不相似的一张</div>
    <div class="choices" id="choices">
      <button data-choice="0" class="choice"><img alt="图片 A"><span>A · 按 1</span></button>
      <button data-choice="1" class="choice"><img alt="图片 B"><span>B · 按 2</span></button>
      <button data-choice="2" class="choice"><img alt="图片 C"><span>C · 按 3</span></button>
    </div>
    <p class="muted center">点击图片，或按键盘 1、2、3 作答。</p>
  </section>

  <section id="break-screen" class="panel center" hidden>
    <h2 id="break-title">休息一下</h2>
    <p id="break-summary"></p>
    <button id="next-block" class="primary">继续</button>
    <button id="export-during">导出数据备份</button>
  </section>

  <section id="finished" class="panel center" hidden>
    <h1>感谢参与</h1>
    <p id="finished-summary"></p>
    <div class="actions centered">
      <button id="export-json" class="primary">导出数据（JSON）</button>
      <button id="export-csv">导出数据（CSV）</button>
      <button id="submit-server" hidden>提交数据</button>
    </div>
    <p id="submit-status" class="muted"></p>
  </section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
